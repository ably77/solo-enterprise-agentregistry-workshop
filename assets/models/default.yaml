# Workshop default Model (Bedrock Claude) — referenced by every Deployment via spec.modelRef.
apiVersion: ar.dev/v1alpha1
kind: Model
metadata:
  name: default
  tag: latest
spec:
  title: "Workshop default (Bedrock Claude)"
  provider: bedrock
  model: us.anthropic.claude-sonnet-4-6
  auth:
    strategy: runtime
  endpoint:
    region: us-east-1
